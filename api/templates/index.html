<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot vs Human Classifier</title>
    <style>
        * {
      margin: 0;
    padding: 0;
box-sizing: border-box;
     }

        body {
       font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
     padding: 20px;
      }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
          margin-bottom: 30px;
        }

 .header h1 {
   font-size: 2.5em;
       margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
   font-size: 1.2em;
   opacity: 0.9;
      }

        .card {
  background: white;
       border-radius: 15px;
      padding: 30px;
   box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin-bottom: 20px;
        }

        .upload-section {
            text-align: center;
        }

        .upload-area {
        border: 3px dashed #667eea;
      border-radius: 10px;
       padding: 40px;
        margin: 20px 0;
   cursor: pointer;
        transition: all 0.3s ease;
        }

      .upload-area:hover {
            background: #f8f9ff;
  border-color: #764ba2;
        }

        .upload-area.dragover {
   background: #e8ebff;
            border-color: #667eea;
        }

      #fileInput {
     display: none;
        }

    .upload-icon {
            font-size: 4em;
margin-bottom: 15px;
   }

    .upload-text {
         font-size: 1.1em;
       color: #666;
    }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
     color: white;
       border: none;
 padding: 12px 30px;
         font-size: 1.1em;
    border-radius: 25px;
     cursor: pointer;
            transition: transform 0.2s ease;
 margin: 10px 5px;
   }

.btn:hover {
       transform: translateY(-2px);
 box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .preview-section {
         display: none;
     margin: 20px 0;
        }

        .preview-image {
     max-width: 100%;
            max-height: 400px;
      border-radius: 10px;
    margin: 15px 0;
        }

        .result-section {
      display: none;
            margin: 20px 0;
        }

        .result-card {
            background: linear-gradient(135deg, #f8f9ff 0%, #e8ebff 100%);
            border-radius: 10px;
            padding: 20px;
    margin: 15px 0;
        }

        .result-label {
     font-size: 1.8em;
        font-weight: bold;
 color: #667eea;
    margin-bottom: 10px;
        }

        .confidence-bar {
        width: 100%;
            height: 30px;
       background: #e0e0e0;
            border-radius: 15px;
    overflow: hidden;
            margin: 10px 0;
    }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        display: flex;
      align-items: center;
         justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
        }

        .probabilities {
  display: flex;
   justify-content: space-around;
       margin: 15px 0;
        }

        .prob-item {
        text-align: center;
            padding: 15px;
        background: white;
 border-radius: 10px;
            flex: 1;
     margin: 0 5px;
  }

        .prob-label {
 font-weight: bold;
            color: #666;
  margin-bottom: 5px;
      }

      .prob-value {
  font-size: 1.5em;
            color: #667eea;
        }

    .loading {
   display: none;
          text-align: center;
        margin: 20px 0;
  }

        .spinner {
            border: 4px solid #f3f3f3;
         border-top: 4px solid #667eea;
            border-radius: 50%;
    width: 50px;
            height: 50px;
      animation: spin 1s linear infinite;
         margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .history-section {
       max-height: 400px;
    overflow-y: auto;
    }

        .history-item {
    background: #f8f9ff;
       padding: 15px;
         margin: 10px 0;
     border-radius: 8px;
     border-left: 4px solid #667eea;
        }

     .stats-grid {
       display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
       gap: 15px;
            margin: 20px 0;
  }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
          padding: 20px;
       border-radius: 10px;
 text-align: center;
        }

        .stat-value {
      font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

     .stat-label {
opacity: 0.9;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
     margin: 15px 0;
   }

        .alert-error {
   background: #fee;
    border-left: 4px solid #f44;
            color: #c00;
        }

        .alert-success {
          background: #efe;
            border-left: 4px solid #4f4;
  color: #060;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>?? Robot vs Human Classifier</h1>
     <p>AI-Powered Image Classification</p>
      </div>

        <!-- Upload Card -->
        <div class="card">
    <div class="upload-section">
    <h2>Upload an Image</h2>
   <div class="upload-area" id="uploadArea">
           <div class="upload-icon">??</div>
          <div class="upload-text">
     <strong>Click to upload</strong> or drag and drop<br>
      Supported formats: JPG, PNG, ARW, RAW, TIFF
        </div>
    </div>
    <input type="file" id="fileInput" accept="image/*,.arw,.raw,.nef,.cr2,.dng">
      
   <div class="preview-section" id="previewSection">
        <img id="previewImage" class="preview-image" alt="Preview">
         <div>
       <button class="btn" id="predictBtn">?? Classify Image</button>
              <button class="btn" id="clearBtn">??? Clear</button>
    </div>
       </div>

       <div class="loading" id="loading">
               <div class="spinner"></div>
   <p>Processing image...</p>
       </div>

                <div id="alertBox"></div>

      <div class="result-section" id="resultSection">
            <div class="result-card">
         <div class="result-label" id="resultLabel"></div>
      <div class="confidence-bar">
      <div class="confidence-fill" id="confidenceFill"></div>
  </div>
       <div class="probabilities" id="probabilities"></div>
       </div>
        </div>
          </div>
        </div>

        <!-- Statistics Card -->
        <div class="card">
  <h2>?? Statistics</h2>
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
          <div class="stat-value" id="totalPredictions">0</div>
  <div class="stat-label">Total Predictions</div>
  </div>
    <div class="stat-card">
        <div class="stat-value" id="avgConfidence">0%</div>
             <div class="stat-label">Avg Confidence</div>
           </div>
            </div>
      </div>

        <!-- History Card -->
        <div class="card">
     <h2>?? Recent Predictions</h2>
            <div class="history-section" id="historySection">
       <p style="text-align: center; color: #999;">No predictions yet</p>
     </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
 const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
  const predictBtn = document.getElementById('predictBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
 const alertBox = document.getElementById('alertBox');

        let selectedFile = null;

   // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
       e.preventDefault();
     uploadArea.classList.add('dragover');
        });

uploadArea.addEventListener('dragleave', () => {
         uploadArea.classList.remove('dragover');
        });

uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
         uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
       if (file) handleFileSelect(file);
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
          if (file) handleFileSelect(file);
  });

   function handleFileSelect(file) {
    selectedFile = file;
            const reader = new FileReader();
   reader.onload = (e) => {
         previewImage.src = e.target.result;
           previewSection.style.display = 'block';
           resultSection.style.display = 'none';
         clearAlert();
     };
        reader.readAsDataURL(file);
      }

        // Predict button
        predictBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            loading.style.display = 'block';
            predictBtn.disabled = true;
        clearAlert();

    try {
          const response = await fetch('/api/predict', {
       method: 'POST',
        body: formData
     });

  const data = await response.json();

     if (data.success) {
        displayResult(data);
showAlert('Image classified successfully!', 'success');
   loadStatistics();
     loadHistory();
     } else {
  showAlert(data.error || 'Prediction failed', 'error');
     }
       } catch (error) {
                showAlert('Error: ' + error.message, 'error');
     } finally {
      loading.style.display = 'none';
 predictBtn.disabled = false;
            }
        });

    // Clear button
        clearBtn.addEventListener('click', () => {
            selectedFile = null;
fileInput.value = '';
         previewSection.style.display = 'none';
        resultSection.style.display = 'none';
            clearAlert();
   });

        function displayResult(data) {
        const resultLabel = document.getElementById('resultLabel');
            const confidenceFill = document.getElementById('confidenceFill');
      const probabilities = document.getElementById('probabilities');

            resultLabel.textContent = data.predicted_class.toUpperCase();
            const confidencePercent = (data.confidence * 100).toFixed(2);
       confidenceFill.style.width = confidencePercent + '%';
            confidenceFill.textContent = confidencePercent + '%';

       // Display probabilities
        probabilities.innerHTML = '';
            for (const [className, prob] of Object.entries(data.probabilities)) {
    const probItem = document.createElement('div');
      probItem.className = 'prob-item';
     probItem.innerHTML = `
           <div class="prob-label">${className.toUpperCase()}</div>
        <div class="prob-value">${(prob * 100).toFixed(2)}%</div>
    `;
    probabilities.appendChild(probItem);
         }

     resultSection.style.display = 'block';
        }

 function showAlert(message, type) {
            alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

    function clearAlert() {
            alertBox.innerHTML = '';
        }

        async function loadStatistics() {
     try {
  const response = await fetch('/api/statistics');
                const data = await response.json();

                if (data.success) {
         const stats = data.statistics;
   document.getElementById('totalPredictions').textContent = stats.total_predictions;
        document.getElementById('avgConfidence').textContent = 
              (stats.average_confidence * 100).toFixed(1) + '%';
    }
            } catch (error) {
    console.error('Error loading statistics:', error);
      }
        }

   async function loadHistory() {
   try {
  const response = await fetch('/api/history?limit=10');
          const data = await response.json();

    const historySection = document.getElementById('historySection');

    if (data.success && data.predictions.length > 0) {
    historySection.innerHTML = data.predictions.map(pred => `
            <div class="history-item">
    <strong>${pred.predicted_class.toUpperCase()}</strong> 
          (${(pred.confidence * 100).toFixed(2)}%)
    <br>
      <small>${pred.filename}</small>
    <br>
     <small style="color: #999;">${new Date(pred.timestamp).toLocaleString()}</small>
      </div>
       `).join('');
   } else {
        historySection.innerHTML = '<p style="text-align: center; color: #999;">No predictions yet</p>';
  }
        } catch (error) {
         console.error('Error loading history:', error);
  }
        }

        // Load statistics and history on page load
        window.addEventListener('load', () => {
            loadStatistics();
    loadHistory();
        });
    </script>
</body>
</html>
